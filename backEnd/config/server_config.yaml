# 服务器配置

server:
  # FastAPI服务器配置
  host: "0.0.0.0"
  port: 8002
  debug: true

  # CORS配置
  cors:
    enabled: true
    allow_origins: ["*"]                      # 允许的源
    allow_credentials: true
    allow_methods: ["*"]
    allow_headers: ["*"]

  # API配置
  api:
    prefix: "/api/v1"                           # API路径前缀
    version: "1.0.0"                             # API版本
    title: "Plant Recognition API"
    description: "植物识别API - 支持Coze在线识别和本地模型识别"

  # 识别策略配置
  recognition:
    prefer_online: true                        # 优先使用在线识别
    auto_fallback: true                      # 失败时自动降级
    network_check_enabled: true                # 是否启用网络检查
